<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Data curation reduced Wikipedia evaluation loss by 21.6 percent</title>
  <rect width="960" height="540" fill="#f7f9fc" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="70" font-size="26" fill="#52637c" font-weight="700" text-anchor="start">AI ENGINEERING</text>
    <text x="52" y="242" font-size="116" fill="#127c72" font-weight="700" text-anchor="start">21.6%</text>
    <text x="56" y="300" font-size="34" fill="#172b4d" font-weight="700" text-anchor="start">lower Wikipedia loss</text>
    <text x="56" y="353" font-size="25" fill="#52637c" font-weight="400" text-anchor="start">Data curation. Measured tradeoffs.</text>
    <rect x="638" y="156.304" width="96" height="225.696" rx="8" fill="#8291a6" />
    <text x="686" y="140.304" font-size="26" fill="#172b4d" font-weight="700" text-anchor="middle">1.8808</text>
    <text x="686" y="418" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">Baseline</text>
    <rect x="772" y="205.036" width="96" height="176.964" rx="8" fill="#127c72" />
    <text x="820" y="189.036" font-size="26" fill="#172b4d" font-weight="700" text-anchor="middle">1.4747</text>
    <text x="820" y="418" font-size="24" fill="#172b4d" font-weight="400" text-anchor="middle">Filtered</text>
    <line x1="52" y1="458" x2="908" y2="458" stroke="#dce3ed" />
    <text x="52" y="502" font-size="25" fill="#52637c" font-weight="400" text-anchor="start">Training / Data / Evaluation</text>
    <text x="909" y="502" font-size="22" fill="#52637c" font-weight="400" text-anchor="end">Fall 2026</text>
  </g>
</svg>
